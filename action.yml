name: "SFDX Scan Pull Request"
description: "Executes Salesforce Code Analyzer on the scope of a pull request, translates the findings into in-line comments."
inputs:
  rule-selector:
    description: "Space delimited rule selectors, each passed to `sf code-analyzer run --rule-selector`, e.g. `pmd:Security eslint:Recommended`. Defaults to `Recommended`."
  config-file:
    description: "Path to a code-analyzer.yml file used to customize engines and rules. Defaults to ./code-analyzer.yml if present."
  severity-threshold:
    description: "Integer threshold (1 Critical - 5 Info). Violations with this severity or more severe fail the action."
  strictly-enforced-rules:
    description: "JSON string which contains the rules which will be strictly enforced regardless of their priority. Enforced rules are identified by their engine and rule name."
  target:
    description: "Optional target to specify a whole directory to run, as opposed to just the diff of a pull request"
  report-mode:
    description: "Use comments or check-runs for reporting errors"
    default: "check-runs"
  delete-resolved-comments:
    description: "Set `true` to delete comments once the issue has been resolved"
    default: "false"
runs:
  using: "node20"
  main: "dist/index.js"
